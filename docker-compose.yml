# Public IVR (and later SMS/email) on a VPS. Caddy terminates TLS for Twilio HTTPS/WSS.
# Resize the host when SpeechBrain, extra voices, or intent models need more RAM.
services:
  app:
    build: .
    env_file:
      - .env
    environment:
      HF_HOME: /app/.cache/huggingface
      PORT: "8000"
    volumes:
      - model-cache:/app/.cache
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  model-cache:
  caddy-data:
  caddy-config:
